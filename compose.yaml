name: ${COMPOSE_PROJECT_NAME:-star-study}
x-app-build: &app-build
  context: .
  args:
    NEXT_PUBLIC_BASE_PATH: ${APP_BASE_PATH:-}
services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: star_study
      POSTGRES_USER: star_study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行安装向导生成数据库密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U star_study -d star_study']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: *app-build
    env_file: .env
    environment:
      DATABASE_URL: postgres://star_study:${POSTGRES_PASSWORD}@database:5432/star_study
    command: [node, dist/migrate.mjs]
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  app:
    build: *app-build
    env_file: .env
    environment:
      DATABASE_URL: postgres://star_study:${POSTGRES_PASSWORD}@database:5432/star_study
      NODE_ENV: production
      HOST: 0.0.0.0
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      NEXT_PUBLIC_BASE_PATH: ${APP_BASE_PATH:-}
    expose: ['3000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000'+(process.env.APP_BASE_PATH||'')+'/api/platform/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?请先设置域名}
      CADDY_DOMAIN: ${CADDY_DOMAIN:-${SITE_ADDRESS}}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      ACME_EMAIL_DIRECTIVE: ${ACME_EMAIL_DIRECTIVE:-}
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - ./${CADDY_CONFIG_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
    labels:
      io.starstudy.installation: ${INSTALL_ID:-legacy}
  caddy_data:
    labels:
      io.starstudy.installation: ${INSTALL_ID:-legacy}
  caddy_config:
    labels:
      io.starstudy.installation: ${INSTALL_ID:-legacy}
networks:
  default:
    labels:
      io.starstudy.installation: ${INSTALL_ID:-legacy}
